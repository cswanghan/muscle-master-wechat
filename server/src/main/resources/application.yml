server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: muscle-master-server
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3306/muscle_master?useUnicode=true&characterEncoding=utf8&connectionTimeZone=Asia/Shanghai&sslMode=DISABLED&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:muscle}
    password: ${SPRING_DATASOURCE_PASSWORD:muscle}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:127.0.0.1}
      port: ${SPRING_DATA_REDIS_PORT:6379}
  flyway:
    enabled: true
    locations: classpath:db/migration

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      # D11 / V1: deleted_at DATETIME(3) NULL. Do not add a deleted TINYINT.
      logic-delete-field: deletedAt
      logic-delete-value: now()
      logic-not-delete-value: "null"

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,flyway
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  prometheus:
    metrics:
      export:
        enabled: true

app:
  jobs:
    enabled: ${APP_JOBS_ENABLED:false}
  snowflake:
    worker-id: ${SNOWFLAKE_WORKER_ID:1}
  jwt:
    secret: ${JWT_SECRET:change-me-dev-only-hs256-key-32bytes!}
    customer-ttl: 2h
    staff-ttl: 8h
  wechat:
    mock: ${WECHAT_MOCK:false}
    customer-app-id: ${WX_C_APP_ID:}
    customer-app-secret: ${WX_C_APP_SECRET:}
    staff-app-id: ${WX_STAFF_APP_ID:}
    staff-app-secret: ${WX_STAFF_APP_SECRET:}
    mock-staff-username: demo.admin
    mchid: ${WX_MCHID:}
    prepay-ttl: 2h
  crypto:
    phone-pepper: ${PHONE_PEPPER:change-me-dev-phone-pepper}
    dek-base64: ${PHONE_DEK_BASE64:}
  catalog:
    near-meters: 1500
    store-cache-ttl: 5m
  availability:
    cache-ttl: 30s
  booking:
    captcha:
      enabled: ${BOOKING_CAPTCHA_ENABLED:false}
    cancel-free-minutes: 120
    lock:
      enabled: ${BOOKING_LOCK_ENABLED:true}
  internal:
    force-release:
      enabled: ${APP_INTERNAL_FORCE_RELEASE:false}
      token: ${APP_INTERNAL_FORCE_RELEASE_TOKEN:}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [%X{requestId:-}] %logger{36} : %m%n"
